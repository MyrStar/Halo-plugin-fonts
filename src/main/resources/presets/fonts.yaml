# 内置预设字体库：均为免费可商用字体
# id 即字体列表中的 name；cssUrl 为字体 CSS 入口（经加速规则做主机替换）
- id: noto-sans-sc
  displayName: 思源黑体
  family: "'Noto Sans SC', sans-serif"
  cssUrl: "https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&display=swap"
  category: 黑体
- id: noto-serif-sc
  displayName: 思源宋体
  family: "'Noto Serif SC', serif"
  cssUrl: "https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700&display=swap"
  category: 宋体
- id: lxgw-wenkai
  displayName: 霞鹜文楷
  family: "'LXGW WenKai Screen', sans-serif"
  cssUrl: "https://cdn.jsdelivr.net/npm/lxgw-wenkai-screen-webfont@1.7.0/style.css"
  category: 楷体
- id: zcool-xiaowei
  displayName: 站酷小薇体
  family: "'ZCOOL XiaoWei', serif"
  cssUrl: "https://fonts.googleapis.com/css2?family=ZCOOL+XiaoWei&display=swap"
  category: 美术体
- id: zcool-kuaile
  displayName: 站酷快乐体
  family: "'ZCOOL KuaiLe', sans-serif"
  cssUrl: "https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&display=swap"
  category: 美术体
- id: ma-shan-zheng
  displayName: 马善政毛笔
  family: "'Ma Shan Zheng', cursive"
  cssUrl: "https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&display=swap"
  category: 手写体
- id: long-cang
  displayName: 龙藏体
  family: "'Long Cang', cursive"
  cssUrl: "https://fonts.googleapis.com/css2?family=Long+Cang&display=swap"
  category: 手写体
